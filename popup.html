<div
  style="align-items: center; display: flex; flex-direction: column; gap: 6px"
>
  <div style="font-size: 20px">
    <strong>{label_state}</strong>
  </div>
  <div>
    <a
      style="
        background-color: #1c4c10;
        border-radius: 999px;
        color: #ffffff;
        display: inline-block;
        font-size: 16px;
        padding: 8px 16px;
        text-decoration: none;
      "
      href="{link}"
      target="_top"
      rel="noopener noreferrer"
      >More Info</a
    >
    <a
      style="
        background-color: #1c4c10;
        border-radius: 999px;
        color: #ffffff;
        display: inline-block;
        font-size: 16px;
        padding: 8px 16px;
        text-decoration: none;
      "
      href="{expression/expr1}"
      target="_top"
      rel="noopener noreferrer"
      >Directions</a
    >
  </div>
  <p style="margin: 4px">
    <img
      style="border-radius: 10px"
      src="{thumbnail_url}"
      alt="Thumbnail"
      width="200"
      height="125"
    />
  </p>
</div>
